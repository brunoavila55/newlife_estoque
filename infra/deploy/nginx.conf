limit_req_zone $binary_remote_addr zone=stock_login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    resolver 127.0.0.11 valid=15s ipv6=off;

    # Apenas o proxy externo integra a rede de entrada.
    set_real_ip_from 172.30.245.0/24;
    real_ip_header X-Real-IP;

    location ~ ^/api/v1/auth/(web/)?login$ {
        limit_req zone=stock_login burst=5 nodelay;
        limit_req_status 429;
        set $backend http://api:3000;
        proxy_pass $backend;
    }

    location ~ ^/(api/|ready$|health$) {
        set $backend http://api:3000;
        proxy_pass $backend;
    }

    location ~ "^/equipment-labels/labels/[a-f0-9-]{36}$" {
        access_log off;
        error_log /dev/null emerg;
        limit_except GET { deny all; }
        if ($args !~* "(^|&)X-Amz-Signature=[a-f0-9]{64}(&|$)") { return 403; }
        set $storage http://seaweedfs:8333;
        proxy_set_header Host $http_host;
        proxy_pass $storage;
        add_header Cache-Control "private, no-store" always;
    }

    location /equipment-labels { return 404; }
    location = /metrics { return 404; }
    location = /sw.js { add_header Cache-Control "no-cache" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri $uri/ /index.html; }
}
