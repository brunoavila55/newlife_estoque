# O nome do projeto fica "newlife-retiradas" de propósito: trocá-lo criaria volumes novos
# (banco e fotos vazios). O domínio público agora é estoque.newlifefibra.com.br.
name: newlife-retiradas
x-runtime: &runtime
  DATABASE_URL: postgres://stock_runtime:${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD}@postgres:5432/stock
  API_BIND: 0.0.0.0:3000
  API_AUTO_MIGRATE: "false"
  S3_ENDPOINT: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT: https://estoque.newlifefibra.com.br
  S3_BUCKET: equipment-labels
  S3_ALLOW_HTTP: "true"
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Defina AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Defina AWS_SECRET_ACCESS_KEY}
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stock
      POSTGRES_USER: stock_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Defina DB_OWNER_PASSWORD}
      STOCK_DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-stock-role.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "stock_owner", "-d", "stock"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  seaweedfs:
    image: chrislusf/seaweedfs:4.55
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: equipment-labels
    volumes:
      - seaweed-data:/data
    restart: unless-stopped
  migrate:
    profiles: ["maintenance"]
    image: newlife-retiradas-api:local
    environment:
      DATABASE_URL: postgres://stock_owner:${DB_OWNER_PASSWORD}@postgres:5432/stock
    command: ["migrate"]
  api:
    image: newlife-retiradas-api:local
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile
      target: api
    environment: *runtime
    restart: unless-stopped
  worker:
    image: newlife-retiradas-api:local
    pull_policy: never
    environment: *runtime
    command: ["worker"]
    restart: unless-stopped
  web:
    image: newlife-retiradas-web:local
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile
      target: web
    networks:
      default: {}
      edge:
        aliases: [newlife-retiradas-web]
    restart: unless-stopped
networks:
  default:
    internal: true
  edge:
    external: true
    name: newlife-retiradas-edge
volumes:
  postgres-data:
  seaweed-data:
